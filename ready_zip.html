<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Totem Maker — ресурспак готов</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript
      ><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    /></noscript>
    <script src="js/layout-boot.js"></script>
    <link rel="stylesheet" href="css/main.css?v=1.0.1" />
    <link rel="stylesheet" href="css/mobile.css?v=1.0.1" />
    <link rel="stylesheet" href="css/layout-overrides.css?v=1.0.1" />
    <link rel="stylesheet" href="css/mobile-layout.css?v=1.0.1" />
    <script src="js/layout.js"></script>
    <script src="lang/ru.js"></script>
    <script src="lang/en.js"></script>
    <script src="js/lang.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  </head>
  <body class="landing-with-marquee" data-i18n-page="done">
    <div class="app-shell">
      <div class="export-card export-card--done">
        <div id="loadingBlock">
          <div class="loader"></div>
          <p id="status" class="status-text" data-i18n="done.building">Сборка архива…</p>
        </div>

        <div id="readyBlock" hidden>
          <h1 class="export-done-title" data-i18n="done.ready">Ресурспак готов.</h1>
          <p class="desc export-done-desc" data-i18n="done.readyHint">Если загрузка не началась, то нажмите на кнопку</p>
          <a
            class="btn btn--mc-orange btn--mc-block"
            href="https://boosty.to/ukengout"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="support.btn"
            >Поддержать автора</a
          >
          <a id="downloadBtn" class="btn btn--mc-gray export-download-btn export-download-btn--compact" data-i18n="done.download">Скачать</a>
          <p class="hint export-restart"><a href="index.html" data-i18n="done.restart">Начать сначала</a></p>
        </div>

        <div id="errorBlock" hidden>
          <p id="errorStatus" class="status-text" data-i18n="done.error">Ошибка</p>
          <p id="errorDesc" class="desc"></p>
          <p class="hint export-restart"><a href="index.html" data-i18n="done.restart">Начать сначала</a></p>
        </div>
      </div>
    </div>

    <script src="js/marquee.js"></script>
    <script>
      const MIN_PACK_FORMAT = 4;

      function buildPackMcmeta(packFormat, nickname) {
        const nick = (nickname || "Player").trim() || "Player";
        return {
          pack: {
            pack_format: packFormat,
            description: `${TotemI18n.t("pack.mcmetaLine1")}\n${TotemI18n.t("pack.mcmetaNick", { nick })}`,
          },
        };
      }

      function normalizePackFormat(raw) {
        const pf = parseInt(raw, 10);
        if (!Number.isFinite(pf)) return 46;
        return Math.max(MIN_PACK_FORMAT, pf);
      }

      let zipBlob = null;
      let zipObjectUrl = null;
      let zipFilename = "Totem.zip";

      function isMobileDownloadContext() {
        if (window.TotemLayout && typeof window.TotemLayout.isMobile === "function") {
          return window.TotemLayout.isMobile();
        }
        return window.innerWidth <= 768;
      }

      function revokeZipObjectUrl() {
        if (zipObjectUrl) {
          URL.revokeObjectURL(zipObjectUrl);
          zipObjectUrl = null;
        }
      }

      async function triggerZipDownload() {
        if (!zipBlob) return false;

        const file = new File([zipBlob], zipFilename, { type: "application/zip" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: zipFilename });
            return true;
          } catch (err) {
            if (err && err.name === "AbortError") return false;
          }
        }

        revokeZipObjectUrl();
        zipObjectUrl = URL.createObjectURL(zipBlob);
        const link = document.createElement("a");
        link.href = zipObjectUrl;
        link.download = zipFilename;
        link.rel = "noopener";
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        link.remove();
        return true;
      }

      function showReady(blob, filename) {
        document.getElementById("loadingBlock").hidden = true;
        document.getElementById("errorBlock").hidden = true;
        document.getElementById("readyBlock").hidden = false;

        zipBlob = blob;
        zipFilename = filename;
        revokeZipObjectUrl();
        zipObjectUrl = URL.createObjectURL(blob);

        const btn = document.getElementById("downloadBtn");
        btn.href = zipObjectUrl;
        btn.download = filename;
        document.body.classList.toggle("export-ready--mobile", isMobileDownloadContext());

        if (isMobileDownloadContext()) return;
        setTimeout(() => btn.click(), 800);
      }

      function showError(title, detail) {
        document.getElementById("loadingBlock").hidden = true;
        document.getElementById("readyBlock").hidden = true;
        document.getElementById("errorBlock").hidden = false;
        document.getElementById("errorStatus").innerText = title;
        document.getElementById("errorDesc").innerText = detail || "";
      }

      document.getElementById("downloadBtn").addEventListener("click", function (e) {
        if (!zipBlob) return;
        if (!isMobileDownloadContext()) return;
        e.preventDefault();
        triggerZipDownload();
      });

      window.addEventListener("pagehide", revokeZipObjectUrl);

      window.onload = async () => {
        TotemI18n.boot();

        const textureData = localStorage.getItem("totemTexture");
        const nickname = localStorage.getItem("playerNickname") || "Player";
        const delay = parseFloat(localStorage.getItem("totemDelay")) || 1;
        const packFormat = String(normalizePackFormat(localStorage.getItem("mcPackFormat") || "46"));

        if (typeof JSZip === "undefined") {
          showError(TotemI18n.t("done.errZip"), TotemI18n.t("done.errZipDetail"));
          return;
        }

        if (!textureData) {
          showError(TotemI18n.t("done.errNoData"), TotemI18n.t("done.errNoDataDetail"));
          return;
        }

        try {
          const zip = new JSZip();

          const pfMeta = normalizePackFormat(packFormat);
          zip.file("pack.mcmeta", JSON.stringify(buildPackMcmeta(pfMeta, nickname), null, 2));

          const packIconData = localStorage.getItem("totemPackIcon");
          if (packIconData && packIconData.includes(",")) {
            const b64png = packIconData.split(",", 2)[1];
            zip.file("pack.png", b64png, { base64: true });
          }

          const base64Content = textureData.includes(",") ? textureData.split(",", 2)[1] : textureData;
          const pf = normalizePackFormat(packFormat);

          if (pf >= 46) {
            buildVanillaItemDefinitionPack(zip, nickname, base64Content, delay);
          } else {
            const citPath = "assets/minecraft/optifine/cit/totem";
            const folder = zip.folder(citPath);
            folder.file("totem.png", base64Content, { base64: true });

            const frameTime = Math.max(1, Math.round(delay * 20));
            const animationMeta = {
              animation: {
                frametime: frameTime,
                interpolate: false,
              },
            };
            folder.file("totem.png.mcmeta", JSON.stringify(animationMeta, null, 2));

            folder.file("totem.properties", buildTotemCitProperties(nickname, packFormat));
          }

          const content = await zip.generateAsync({ type: "blob" });
          const safeNick = nickname.replace(/[/\\:*?"<>|]/g, "_").slice(0, 48);
          showReady(content, `Totem_${safeNick}.zip`);
        } catch (err) {
          console.error(err);
          showError(TotemI18n.t("done.errBuild"), String(err.message || err));
        }
      };

      function buildTotemCitProperties(nickname, packFormat) {
        const nick = (nickname || "Player").trim() || "Player";
        const pf = normalizePackFormat(packFormat);

        const lines = ["type=item", "items=minecraft:totem_of_undying", "texture=totem"];

        if (pf === 32) lines.push(`components.minecraft\\:custom_name=ipattern:*${nick}*`);
        else lines.push(`nbt.display.Name=ipattern:*${nick}*`);

        return lines.join("\n");
      }

      function buildVanillaItemDefinitionPack(zip, nickname, textureBase64, delaySeconds) {
        const nick = (nickname || "Player").trim() || "Player";
        const frameTime = Math.max(1, Math.round((parseFloat(delaySeconds) || 1) * 20));
        const jsonTextName = JSON.stringify({ text: nick });

        const itemDef = {
          model: {
            type: "minecraft:select",
            property: "minecraft:component",
            component: "minecraft:custom_name",
            cases: [
              {
                when: [nick, jsonTextName],
                model: {
                  type: "minecraft:model",
                  model: "minecraft:item/custom_totem",
                },
              },
            ],
            fallback: {
              type: "minecraft:model",
              model: "minecraft:item/totem_of_undying",
            },
          },
        };

        const modelDef = {
          parent: "minecraft:item/generated",
          textures: {
            layer0: "minecraft:item/custom_totem",
          },
        };

        const animationMeta = {
          animation: {
            interpolate: true,
            frametime: frameTime,
          },
        };

        zip.file("assets/minecraft/items/totem_of_undying.json", JSON.stringify(itemDef, null, 2));
        zip.file("assets/minecraft/models/item/custom_totem.json", JSON.stringify(modelDef, null, 2));
        zip.file("assets/minecraft/textures/item/custom_totem.png", textureBase64, { base64: true });
        zip.file("assets/minecraft/textures/item/custom_totem.png.mcmeta", JSON.stringify(animationMeta, null, 2));
      }
    </script>
  </body>
</html>
