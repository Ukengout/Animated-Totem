<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Totem Maker</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript
      ><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    /></noscript>
    <link rel="stylesheet" href="css/main.css?v=1.0.2" />
    <script src="lang/ru.js"></script>
    <script src="lang/en.js"></script>
    <script src="js/lang.js"></script>
  </head>
  <body class="device-pick-page" data-i18n-page="index">
    <div class="lang-switcher lang-switcher--device-pick" role="group">
      <button type="button" class="lang-switcher__btn" data-lang="ru" data-i18n="lang.ru">RU</button>
      <button type="button" class="lang-switcher__btn" data-lang="en" data-i18n="lang.en">EN</button>
    </div>

    <main class="device-pick-shell">
      <div class="glass-panel device-pick-panel">
        <h1 class="device-pick-title" data-i18n="welcome.title">Что вы используете сейчас</h1>
        <div class="device-pick-actions" role="group" data-i18n-aria="welcome.groupAria">
          <button type="button" class="btn btn--mc-green btn--mc-block device-pick-btn" data-device="mobile">
            <span class="device-pick-btn__icon" aria-hidden="true">📲</span>
            <span data-i18n="welcome.mobile">Смартфон</span>
          </button>
          <button type="button" class="btn btn--mc-green btn--mc-block device-pick-btn" data-device="desktop">
            <span class="device-pick-btn__icon" aria-hidden="true">🖥️</span>
            <span data-i18n="welcome.desktop">ПК</span>
          </button>
        </div>
      </div>
    </main>

    <script>
      document.querySelectorAll("[data-device]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var mode = btn.getAttribute("data-device");
          if (mode !== "mobile" && mode !== "desktop") return;
          sessionStorage.setItem("totemLayout", mode);
          window.location.href = "getting_skin.html";
        });
      });

      TotemI18n.boot();
    </script>
  </body>
</html>
