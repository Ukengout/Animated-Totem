<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Totem Maker — ресурспак</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript
      ><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    /></noscript>
    <script src="js/layout-boot.js"></script>
    <link rel="stylesheet" href="css/main.css?v=1.0.1" />
    <link rel="stylesheet" href="css/mobile.css?v=1.0.1" />
    <link rel="stylesheet" href="css/layout-overrides.css?v=1.0.1" />
    <link rel="stylesheet" href="css/mobile-layout.css?v=1.0.1" />
    <script src="js/layout.js"></script>
    <script src="lang/ru.js"></script>
    <script src="lang/en.js"></script>
    <script src="js/lang.js"></script>
  </head>
  <body class="landing-with-marquee has-site-support" data-i18n-page="pack">
    <header class="preview-header">
      <a href="animation_editor.html" data-i18n="pack.backEditor">← Назад к редактору</a>
    </header>

    <div class="app-shell" style="min-height: 100vh">
      <div id="previewContainer" class="preview-step preview-step--form-only">
        <div class="controls-card controls-card--resource-pack">
          <div class="input-group">
            <label for="playerNickname" data-i18n="pack.nick">Ник</label>
            <input type="text" id="playerNickname" spellcheck="false" placeholder="TotemLord" maxlength="48" autocomplete="nickname" />
            <span class="hint" data-i18n="pack.nickHint">
              Это текст который вы вводите в наковальне для изменения текстуры тотема
            </span>
          </div>
          <div class="input-group input-group--pack-icon">
            <label for="packIconInput" data-i18n="pack.icon">Иконка ресурспака</label>
            <div class="pack-icon-row">
              <div class="pack-icon-preview-wrap" id="packIconFrame" data-i18n-title="pack.iconPreview">
                <img id="packIconThumb" class="pack-icon-thumb" src="assets/pack-icon-default.png" alt="" />
              </div>
              <div class="pack-icon-actions">
                <div class="upload-row pack-icon-upload-row">
                  <button class="btn btn--mc-green btn--pack-icon" type="button" onclick="document.getElementById('packIconInput').click()" data-i18n="pack.chooseFile">
                    Выбрать файл
                  </button>
                  <button class="btn btn--mc-red-muted btn--pack-icon" type="button" id="packIconClear" style="display: none" data-i18n="pack.reset">
                    Сбросить
                  </button>
                </div>
                <input type="file" id="packIconInput" accept="image/png,image/jpeg,image/webp" style="display: none" />
              </div>
            </div>
            <p class="hint pack-icon-size-hint" id="packIconStatus" aria-hidden="true"></p>
          </div>
          <div class="grid-2">
            <div class="input-group input-group--version">
              <label for="mcVersion" data-i18n="pack.version">Версия</label>
              <select id="mcVersion" data-i18n-title="pack.versionTitle">
                <option value="46" selected>1.21.4+</option>
                <option value="42">1.21.2+</option>
                <option value="34">1.21 — 1.21.1</option>
                <option value="32">1.20.6 — 1.20.5</option>
                <option value="22">1.20.4 — 1.20.3</option>
                <option value="18">1.20.2</option>
                <option value="15">1.20.1 — 1.20</option>
                <option value="13">1.19.4</option>
                <option value="9">1.19.3 — 1.19</option>
                <option value="8">1.18.2 — 1.18</option>
                <option value="7">1.17.1 — 1.17</option>
                <option value="6">1.16.5 — 1.16.2</option>
                <option value="5">1.16.1 — 1.15</option>
                <option value="4">1.14.4 — 1.13</option>
              </select>
            </div>
            <div class="input-group input-group--speed">
              <label data-i18n="pack.speed">Скорость</label>
              <div class="time-badge" id="speedInfo">1.0 сек</div>
            </div>
          </div>
          <p class="hint pack-version-hint" data-i18n-html="pack.optifineHint">
            Ниже 1.21.4 — нужен OptiFine,<br />
            выше не требуется.
          </p>
          <button class="btn btn--mc-green btn--mc-block" type="button" style="margin-top: 4px" onclick="saveAndNext()" data-i18n="pack.buildZip">
            Далее — собрать ZIP
          </button>
        </div>
      </div>
    </div>

    <aside class="site-support-bar" data-i18n-aria="support.aria">
      <a
        class="btn btn--mc-orange btn--site-support"
        href="https://boosty.to/ukengout"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="support.btn"
        >Поддержать автора</a
      >
    </aside>

    <script src="js/marquee.js"></script>
    <script>
      const delayValue = parseFloat(localStorage.getItem("totemDelay")) || 1;

      function refreshSpeedInfo() {
        const v = (Math.round(delayValue * 10) / 10).toFixed(1);
        document.getElementById("speedInfo").textContent = TotemI18n.t("pack.speedValue", { value: v });
      }

      const nickInput = document.getElementById("playerNickname");
      const savedNick = localStorage.getItem("playerNickname");
      if (savedNick) nickInput.value = savedNick;
      nickInput.addEventListener("input", () => {
        localStorage.setItem("playerNickname", nickInput.value.trimEnd());
      });

      const DEFAULT_PACK_ICON = "assets/pack-icon-default.png";
      const packInput = document.getElementById("packIconInput");
      const packThumb = document.getElementById("packIconThumb");
      const packClearBtn = document.getElementById("packIconClear");
      const packStatus = document.getElementById("packIconStatus");
      const savedPack = localStorage.getItem("totemPackIcon");
      if (savedPack) {
        packThumb.src = savedPack;
        packClearBtn.style.display = "inline-block";
      }

      packInput.addEventListener("change", () => {
        const f = packInput.files && packInput.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          const im = new Image();
          im.onload = () => {
            const cnv = document.createElement("canvas");
            cnv.width = 500;
            cnv.height = 500;
            const gx = cnv.getContext("2d");
            gx.imageSmoothingEnabled = true;
            gx.imageSmoothingQuality = "high";
            gx.drawImage(im, 0, 0, 500, 500);
            const dataUrl = cnv.toDataURL("image/png");
            localStorage.setItem("totemPackIcon", dataUrl);
            packThumb.src = dataUrl;
            packClearBtn.style.display = "inline-block";
            packStatus.textContent = "";
          };
          im.onerror = () => {
            packStatus.textContent = "";
          };
          im.src = rd.result;
        };
        rd.readAsDataURL(f);
        packInput.value = "";
      });
      packClearBtn.addEventListener("click", () => {
        localStorage.removeItem("totemPackIcon");
        packThumb.src = DEFAULT_PACK_ICON;
        packClearBtn.style.display = "none";
        packStatus.textContent = "";
      });

      const pfSel = document.getElementById("mcVersion");
      const pfSaved = localStorage.getItem("mcPackFormat");
      const minPf = 4;
      if (pfSaved && parseInt(pfSaved, 10) >= minPf && [...pfSel.options].some((o) => String(o.value) === String(pfSaved))) {
        pfSel.value = String(pfSaved);
      } else if (pfSaved && parseInt(pfSaved, 10) < minPf) {
        localStorage.setItem("mcPackFormat", "4");
      }

      function saveAndNext() {
        localStorage.setItem("playerNickname", nickInput.value.trim() || "Totem");
        localStorage.setItem("mcPackFormat", document.getElementById("mcVersion").value);
        window.location.href = "ready_zip.html";
      }

      document.addEventListener("totem-i18n-applied", refreshSpeedInfo);
      TotemI18n.boot();
      refreshSpeedInfo();
    </script>
  </body>
</html>
